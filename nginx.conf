load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes  1;
#error_log  logs/error.log;

events {
    worker_connections  1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935; # Listen on standard RTMP port
        listen [::]:1935 ipv6only=on;
        chunk_size 1024;

        application live {
            live on;
            record off; # Disable recording

            # Ultra low-latency settings (sub-second target for VLC/ffplay)
            sync 5ms;                 # Aggressively drop drifting frames to keep latency minimal
            wait_key off;             # Send frames immediately without waiting for keyframe boundary
            wait_video off;           # Do not wait for video stream to start audio
            drop_idle_publisher 10s;  # Drop publisher after 10s of inactivity
            interleave off;           # Transmit audio and video independently without interleaving wait
            play_restart on;          # Send reset on play to restart client buffers

            # HLS for Web live hover preview
            hls on;
            hls_path /tmp/hls;
            hls_fragment 1s;
            # Lightweight thumbnail snapshot generator (15 frames per second, scaled to 160x90)
            exec_push /usr/bin/ffmpeg -threads 1 -skip_frame nokey -i rtmp://localhost:1935/$app/$name -vf "fps=15,scale=160:90" -q:v 7 -update 1 -y /tmp/thumbnails/$name.jpg;
        }
    }
}


http {
        sendfile off;
        tcp_nopush on;
        directio 512;
        # HTTP server required to serve the player and HLS fragments
        server {
                listen 8080;
                listen [::]:8080 ipv6only=on;

                # This URL provides RTMP statistics in XML
                location /stat {
                        rtmp_stat all;
                        rtmp_stat_stylesheet /stat.xsl; # Use stat.xsl stylesheet
                }

                location /stat.xsl {
                        # XML stylesheet to view RTMP stats.
                        root /var/www/html/rtmp;
                }

                # JPEG thumbnails endpoint for zero-overhead previews
                location /thumbnails {
                        root /tmp;
                        add_header Cache-Control "no-cache, no-store, must-revalidate";
                        add_header Access-Control-Allow-Origin *;
                }

                # HLS fragments for preview player
                location /hls {
                        types {
                                application/vnd.apple.mpegurl m3u8;
                                video/mp2t ts;
                        }
                        root /tmp;
                        add_header Cache-Control no-cache;
                        add_header Access-Control-Allow-Origin *;
                }

        }
}
