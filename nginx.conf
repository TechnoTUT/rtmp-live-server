load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes  1;
#error_log  logs/error.log;

events {
    worker_connections  1024;
}

# RTMP configuration
rtmp {
    server {
        listen 1935; # Listen on standard RTMP port
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;

        application live {
            live on;
            record off; # Disable recording

            # Low latency & anti-buffer-accumulation settings
            sync 10ms;                # Drop lagging frames when audio/video timestamps drift to prevent accumulating delay
            wait_key on;              # Wait for keyframe before sending video to new subscribers to prevent artifacts
            wait_video on;            # Do not send audio until first video frame arrives
            drop_idle_publisher 10s;  # Drop publisher after 10s of inactivity
            interleave off;           # Transmit audio and video independently without interleaving wait
            play_restart on;          # Send reset on play to restart client buffers

            # HLS for Web live hover preview
            hls on;
            hls_path /tmp/hls;
            hls_fragment 1s;
            hls_playlist_length 3s;
        }
    }
}


http {
        sendfile off;
        tcp_nopush on;
        directio 512;
        # HTTP server required to serve the player and HLS fragments
        server {
                listen 8080;
                listen [::]:8080 ipv6only=on;

                # This URL provides RTMP statistics in XML
                location /stat {
                        rtmp_stat all;
                        rtmp_stat_stylesheet /stat.xsl; # Use stat.xsl stylesheet
                }

                location /stat.xsl {
                        # XML stylesheet to view RTMP stats.
                        root /var/www/html/rtmp;
                }

                # HLS fragments for preview player
                location /hls {
                        types {
                                application/vnd.apple.mpegurl m3u8;
                                video/mp2t ts;
                        }
                        root /tmp;
                        add_header Cache-Control no-cache;
                        add_header Access-Control-Allow-Origin *;
                }

        }
}
